# Alembic configuration.
#
# The sqlalchemy.url here is intentionally a placeholder: alembic/env.py reads
# the real URL from the application Settings (i.e. from the environment), so
# there is exactly ONE source of truth for the database URL and no credentials
# are ever committed.
[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped, sortable revision filenames: 2026_09_08_1430-ab12cd_add_x.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
