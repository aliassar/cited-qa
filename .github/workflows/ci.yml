name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests scripts alembic
          ruff format --check app tests scripts alembic
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest
      - name: Migrations apply from scratch and round-trip
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t cited-qa:ci .
      - name: The container starts and reports healthy
        run: |
          # One worker: with the default local SQLite, several workers would
          # race to create the same tables on startup.
          docker run -d --name app -p 8000:8000 cited-qa:ci \
            uvicorn app.main:app --host 0.0.0.0 --port 8000
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health/live && exit 0
            sleep 2
          done
          docker logs app; exit 1
