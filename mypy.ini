# Pragmatic mypy settings: strict enough to catch real mistakes, lenient enough
# not to fight the type checker over third-party stubs. Tighten per-module as
# the codebase matures - `disallow_untyped_defs` on new packages first.
#
# CI runs `mypy app`; tests are not type-checked.
[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
# Some dependencies ship without type information. Treat them as `Any` rather
# than failing the run; our own code is still fully checked.
disable_error_code = import-untyped
ignore_missing_imports = True
