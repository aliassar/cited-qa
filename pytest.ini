[pytest]
# asyncio_mode = auto means "async def test_..." just works, no @pytest.mark.asyncio
# on every single test.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# -q quiet, --strict-markers catches typos in marker names instead of ignoring them.
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
